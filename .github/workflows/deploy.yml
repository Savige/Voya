name: Deploy Waypoint

# Synology is on LAN only — GitHub-hosted runners cannot reach 192.168.1.x.
# Deploy from a self-hosted runner on the home Mac (labels: self-hosted, macOS, synology-lan).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-waypoint
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS, synology-lan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Synology over LAN
        run: |
          set -euo pipefail
          chmod +x deploy/ci-deploy-nas.sh
          ./deploy/ci-deploy-nas.sh

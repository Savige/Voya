# Example Nginx server blocks if you use raw Nginx + certbot (not Nginx Proxy Manager).
# With NPM, configure Proxy Hosts in the admin UI instead — see deploy/NPM.md.
# Replace paths if needed. SPA root should match where you copy `dist/` (e.g. /var/www/waypoint).

server {
    listen 443 ssl http2;
    server_name waypoint.savige.me;

    ssl_certificate     /etc/letsencrypt/live/waypoint.savige.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waypoint.savige.me/privkey.pem;

    root /var/www/waypoint;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires epoch;
    }

    location / {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.savige.me;

    ssl_certificate     /etc/letsencrypt/live/api.savige.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.savige.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

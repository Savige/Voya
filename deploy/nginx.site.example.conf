# Example Nginx server blocks if you use raw Nginx + certbot (not Nginx Proxy Manager).
# With NPM, configure Proxy Hosts in the admin UI instead — see deploy/NPM.md.
# Replace paths if needed. SPA root should match where you copy `dist/` (e.g. /var/www/waypoint).

server {
    listen 443 ssl http2;
    server_name waypoint.ryansavige.com;

    ssl_certificate     /etc/letsencrypt/live/waypoint.ryansavige.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waypoint.ryansavige.com/privkey.pem;

    root /var/www/waypoint;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.ryansavige.com;

    ssl_certificate     /etc/letsencrypt/live/api.ryansavige.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ryansavige.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Waypoint static site. Run from repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Compose loads deploy/.env (same directory as this file). deploy/.env is a symlink to .env.production — edit deploy/.env.production.
# If you use --env-file: from repo root use deploy/.env.production; from inside deploy/ use .env.production (not deploy/.env.production or the path doubles).
# Supabase runs separately (official docker stack); see deploy/SUPABASE.md

services:
  waypoint:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID}
        VITE_APP_BUILD: ${VITE_APP_BUILD:-}
        BUILD_NUMBER: ${BUILD_NUMBER:-}
    ports:
      # Publish on all interfaces so Nginx Proxy Manager (Docker) can reach the host via 172.17.0.1:8081.
      # Block 8081 from the WAN in your firewall if this host is public.
      - "8081:80"
    restart: unless-stopped
